name: Apply Blender production migrations

on:
  # Production writes are explicit operator actions, never branch-push side effects.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-blender-production-migrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[blender-production-migrations-applied]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Check out current integration branch
        uses: actions/checkout@v6
        with:
          ref: feat/blender-character-quality-pipeline-20260904
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Apply source-aware quality migration
        run: python3 scripts/apply-blender-source-aware-quality.py

      - name: Apply capability-aware Orion normalization
        run: |
          python3 scripts/fix-blender-orion-capability-audit.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/blender/toonstudio_blender_kit/quality.py")
          source = path.read_text(encoding="utf-8")
          broken = "\n   if degenerate_total > budget.max_degenerate_faces:"
          fixed = "\n    if degenerate_total > budget.max_degenerate_faces:"
          if broken in source:
              path.write_text(source.replace(broken, fixed, 1), encoding="utf-8")
          PY

      - name: Stage generated workflow contract outside workflows directory
        run: |
          mkdir -p .migration-output
          cp .github/workflows/blender-character-pipeline.yml .migration-output/blender-character-pipeline.yml
          git restore --source=HEAD -- .github/workflows/blender-character-pipeline.yml
          git diff --exit-code -- .github/workflows/blender-character-pipeline.yml
          git diff --check
          git status --short

      - name: Validate Python and JSON contracts
        run: |
          python3 -m py_compile \
            tools/blender/toonstudio_blender_kit/contracts.py \
            tools/blender/toonstudio_blender_kit/quality.py \
            tools/blender/toonstudio_blender_kit/face.py \
            tools/blender/toonstudio_blender_kit/vrm.py \
            tools/blender/toonstudio_blender_kit/geometry.py \
            tools/blender/toonstudio_blender_kit/pipeline.py \
            tests/blender/test_pipeline_regressions.py \
            tests/blender/test_source_contracts.py
          python3 -m json.tool config/blender/reference-character.json >/dev/null
          python3 -m json.tool config/blender/avatar-orion-production.json >/dev/null
          python3 -m json.tool config/blender/toonstudio-character-pipeline.schema.json >/dev/null
          python3 -m unittest discover -s tests/blender -p 'test_*.py' -v

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository and package verification
        run: |
          pnpm run validate:architecture
          pnpm exec tsx scripts/verify-blender-character-pipeline.mjs
          pnpm exec eslint --max-warnings=0 \
            apps/web/src/domains/creator/vrm/studio-vrm-blender-character-package.ts \
            apps/web/src/domains/creator/vrm/studio-vrm-blender-character-package.test.ts \
            apps/web/src/domains/creator/vrm/studio-vrm-blender-character-loader.test.ts
          pnpm exec vitest run \
            apps/web/src/domains/creator/vrm/studio-vrm-blender-character-package.test.ts \
            apps/web/src/domains/creator/vrm/studio-vrm-blender-character-loader.test.ts
          pnpm exec tsc -p tsconfig.json --noEmit --incremental false

      - name: Commit verified product migration
        run: |
          rm -f scripts/fix-blender-orion-capability-audit.py
          rm -f scripts/apply-blender-source-aware-quality.py
          find tools tests scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          find tools tests scripts -type f -name '*.py[co]' -delete
          git config user.name "toonstudio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit --no-verify -m "fix(blender): apply capability-aware source quality [blender-production-migrations-applied]"
          git push --no-verify origin HEAD:feat/blender-character-quality-pipeline-20260904
