name: SonarQube

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '**/*lock*'
      - '**/data/catalog*.json*'
      - '**/qa-results/**'
      - '**/*.glb'
      - '**/*.wasm'
      - '**/public/**/*.svg'
      - '**/public/**/*.ico'
      - '**/public/**/*.avif'
      - '**/public/**/*.webp'
      - '**/public/**/*.jpeg'
      - '**/public/**/*.jpg'
      - '**/public/**/*.png'
      - '**/public/assets/**'
      - '**/i18n/**/*.json'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '**/*lock*'
      - '**/data/catalog*.json*'
      - '**/qa-results/**'
      - '**/*.glb'
      - '**/*.wasm'
      - '**/public/**/*.svg'
      - '**/public/**/*.ico'
      - '**/public/**/*.avif'
      - '**/public/**/*.webp'
      - '**/public/**/*.jpeg'
      - '**/public/**/*.jpg'
      - '**/public/**/*.png'
      - '**/public/assets/**'
      - '**/i18n/**/*.json'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sonarqube:
    name: SonarQube quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_SCANNER_OPTS: -Xmx6144m
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Check SonarQube secrets
        id: secrets
        run: |
          if [ -n "$SONAR_HOST_URL" ] && [ -n "$SONAR_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SonarQube secrets not configured; skipping scan."
          fi

      - uses: actions/checkout@v6
        if: steps.secrets.outputs.configured == 'true'
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6 # NOSONAR S7637 신뢰된 1st-party 액션
        if: steps.secrets.outputs.configured == 'true'

      - uses: actions/setup-node@v6
        if: steps.secrets.outputs.configured == 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.secrets.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      # SonarCloud Automatic Analysis should be disabled to avoid duplicate scans.
      - name: SonarQube scan
        if: steps.secrets.outputs.configured == 'true'
        uses: SonarSource/sonarqube-scan-action@v7 # NOSONAR S7637 신뢰된 1st-party 액션
        env:
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
