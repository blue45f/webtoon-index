name: Studio raster snapshot stability

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/src/domains/creator/studio-smudge-worker-*.ts'
      - 'apps/web/src/domains/creator/studio-retouch-worker-*.ts'
      - 'apps/web/src/domains/creator/studio-raster-worker-*.ts'
      - 'apps/web/src/domains/creator/studio-abortable-serial-queue.ts'
      - '.github/workflows/studio-raster-snapshot-stability.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/src/domains/creator/studio-smudge-worker-*.ts'
      - 'apps/web/src/domains/creator/studio-retouch-worker-*.ts'
      - 'apps/web/src/domains/creator/studio-raster-worker-*.ts'
      - 'apps/web/src/domains/creator/studio-abortable-serial-queue.ts'
      - '.github/workflows/studio-raster-snapshot-stability.yml'
  workflow_dispatch:

permissions:
  contents: read

# main 푸시도 최신 커밋만 남긴다. 그룹을 SHA 로 묶으면 main 실행이 저마다 다른 그룹이 되어
# cancel-in-progress 가 취소할 대상을 갖지 못한다 (ref 로 묶어야 같은 그룹이 된다). 이 게이트는
# 브랜치 보호의 필수 체크가 아니므로 최신 main 상태만 검증하면 되고, 커밋별 신호가 필요한
# ci.yml 은 그대로 SHA 로 묶어 둔다.
concurrency:
  group: studio-raster-snapshot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  raster-snapshots:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Record actual tested revision
        run: |
          mkdir -p /tmp/studio-raster-snapshot-evidence
          git rev-parse HEAD > /tmp/studio-raster-snapshot-evidence/tested-head.txt
          git diff --exit-code
      - name: Existing raster behavior and new admission regressions
        run: |
          pnpm exec vitest run \
            apps/web/src/domains/creator/studio-smudge-worker-client.test.ts \
            apps/web/src/domains/creator/studio-retouch-worker-client.test.ts \
            apps/web/src/domains/creator/studio-raster-worker-queue-stability.test.ts \
            apps/web/src/domains/creator/studio-raster-worker-idle-stability.test.ts \
            apps/web/src/domains/creator/studio-raster-worker-request-snapshot.test.ts \
            --reporter=default --reporter=json \
            --outputFile.json=/tmp/studio-raster-snapshot-evidence/vitest.json
      - name: Strict lint of affected sources and tests
        run: |
          set -o pipefail
          pnpm exec eslint --max-warnings=0 \
            apps/web/src/domains/creator/studio-smudge-worker-client.ts \
            apps/web/src/domains/creator/studio-retouch-worker-client.ts \
            apps/web/src/domains/creator/studio-abortable-serial-queue.ts \
            apps/web/src/domains/creator/studio-raster-worker-queue-stability.test.ts \
            apps/web/src/domains/creator/studio-raster-worker-idle-stability.test.ts \
            apps/web/src/domains/creator/studio-raster-worker-request-snapshot.test.ts \
            2>&1 | tee /tmp/studio-raster-snapshot-evidence/lint.log
      - name: Full frontend TypeScript check
        run: |
          set -o pipefail
          pnpm exec tsc -p tsconfig.json --noEmit \
            2>&1 | tee /tmp/studio-raster-snapshot-evidence/types.log
      - name: Preserve executed pass or failure evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: studio-raster-snapshot-evidence
          path: /tmp/studio-raster-snapshot-evidence
          retention-days: 7
          if-no-files-found: warn
