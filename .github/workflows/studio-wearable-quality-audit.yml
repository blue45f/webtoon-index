name: Studio wearable quality audit
on:
  push:
    branches: [fix/studio-wearable-quality-audit-20260906]
    paths: ['.github/workflows/studio-wearable-quality-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wearable-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Validate committed GLB bytes and catalogue sources
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          import validator from 'gltf-validator';
          const assets=JSON.parse(fs.readFileSync('apps/web/public/assets/3d/wearable-v5-manifest.json','utf8')).assets;
          const reports=[];
          for(const asset of assets){
            const bytes=fs.readFileSync('apps/web/public/assets/3d/'+asset.file);
            if(createHash('sha256').update(bytes).digest('hex')!==asset.sha256)throw new Error('Committed asset hash mismatch: '+asset.id);
            const result=await validator.validateBytes(new Uint8Array(bytes),{uri:asset.file,maxIssues:30});
            reports.push({id:asset.id,issues:result.issues,info:result.info});
          }
          fs.mkdirSync('.artifacts',{recursive:true});
          fs.writeFileSync('.artifacts/wearable-glb-validation.json',JSON.stringify(reports,null,2));
          if(reports.some(report=>report.issues.numErrors))throw new Error('GLB validation errors');
          EOF
          pnpm exec vitest run apps/web/src/domains/creator/vrm/studio-vrm-wearable-v5.test.ts apps/web/src/domains/creator/vrm/studio-vrm-props.test.ts apps/web/src/domains/creator/studio-everyday-props-pack-v4.test.ts
      - name: Inspect standalone and worn production renderers
        run: pnpm exec tsx scripts/verify-studio-wearable-v5.mts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wearable-v5-review-${{ github.sha }}
          path: |
            .artifacts/studio-wearable-v5/contact-sheet-*.jpg
            .artifacts/studio-wearable-v5/review.json
            .artifacts/wearable-glb-validation.json
          retention-days: 7
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wearable-v5-closeups-${{ github.sha }}
          path: .artifacts/studio-wearable-v5/screenshots/*.png
          retention-days: 7
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wearable-v5-runtime-${{ github.sha }}
          path: |
            .artifacts/studio-wearable-v5/runtime/
            .artifacts/studio-wearable-v5/page.mjs
            .artifacts/studio-wearable-v5/index.html
          retention-days: 7
          include-hidden-files: true
