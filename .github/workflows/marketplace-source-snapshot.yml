name: Marketplace source snapshot

on:
  push:
    branches:
      - feat/marketplace-creator-pipeline-20260903
    paths:
      - ".github/workflows/marketplace-source-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Pack editable source
        run: |
          # Refresh marker: merge-readiness-product-integration-v1
          # Keep this list broad enough that an external hardening pass can reproduce the exact
          # authoring branch without generated catalog data or build products.
          candidates=(
            .github apps packages src lib scripts e2e public
            index.html package.json pnpm-lock.yaml pnpm-workspace.yaml
            tsconfig.json vite.config.ts playwright.config.ts turbo.json
          )
          paths=()
          for path in "${candidates[@]}"; do
            if [[ -e "$path" ]]; then
              paths+=("$path")
            fi
          done
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=dist \
            --exclude=coverage \
            --exclude=test-results \
            --exclude=playwright-report \
            --exclude=artifacts \
            --exclude=qa-results \
            --exclude=apps/web/public/data \
            -czf /tmp/toonspectrum-market-source.tgz \
            "${paths[@]}"

      - uses: actions/upload-artifact@v6
        with:
          name: toonspectrum-market-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/toonspectrum-market-source.tgz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
