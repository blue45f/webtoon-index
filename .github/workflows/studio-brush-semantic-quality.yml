# Runtime-grounded merge gate: names, actual engines and deterministic material response must agree.
name: Studio brush semantic quality

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/audit-studio-brush-pressure-curves.mts"
      - "scripts/audit-studio-brush-semantic-quality.mts"
      - "apps/web/src/domains/creator/StudioActiveBrushSummary.test.tsx"
      - "apps/web/src/domains/creator/StudioActiveBrushSummary.tsx"
      - "apps/web/src/domains/creator/brush/StudioBrushEngineMixer.test.tsx"
      - "apps/web/src/domains/creator/brush/StudioBrushEngineMixer.tsx"
      - "apps/web/src/domains/creator/brush/StudioBrushEngineProgramControls.test.tsx"
      - "apps/web/src/domains/creator/brush/StudioBrushEngineProgramControls.tsx"
      - "apps/web/src/domains/creator/brush/studio-brush-catalog.ts"
      - "apps/web/src/domains/creator/brush/studio-brush-engine-mix.test.ts"
      - "apps/web/src/domains/creator/brush/studio-brush-engine-mix.ts"
      - "apps/web/src/domains/creator/brush/studio-brush-material-distinctness.test.ts"
      - "apps/web/src/domains/creator/brush/studio-brush-material-distinctness.ts"
      - "apps/web/src/domains/creator/brush/studio-brush-pressure-curve-quality.test.ts"
      - "apps/web/src/domains/creator/brush/studio-brush-pressure-curve-quality.ts"
      - "apps/web/src/domains/creator/brush/studio-brush-semantic-quality.test.ts"
      - "apps/web/src/domains/creator/brush/studio-brush-semantic-quality.ts"
      - ".github/workflows/studio-brush-semantic-quality.yml"
  push:
    branches: [main]
    paths:
      - "scripts/audit-studio-brush-pressure-curves.mts"
      - "scripts/audit-studio-brush-semantic-quality.mts"
      - "apps/web/src/domains/creator/StudioActiveBrushSummary.test.tsx"
      - "apps/web/src/domains/creator/StudioActiveBrushSummary.tsx"
      - "apps/web/src/domains/creator/brush/**"
      - ".github/workflows/studio-brush-semantic-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-brush-semantic-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semantic-quality:
    name: semantic-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify runtime-grounded brush semantics and engine composition
        run: >-
          pnpm exec vitest run
          apps/web/src/domains/creator/brush/studio-brush-semantic-quality.test.ts
          apps/web/src/domains/creator/brush/studio-brush-material-distinctness.test.ts
          apps/web/src/domains/creator/brush/studio-brush-pressure-curve-quality.test.ts
          apps/web/src/domains/creator/StudioActiveBrushSummary.test.tsx
          apps/web/src/domains/creator/brush/studio-brush-catalog-lazy-boundary.test.ts
          apps/web/src/domains/creator/brush/studio-brush-engine-mix.test.ts
          apps/web/src/domains/creator/brush/StudioBrushEngineMixer.test.tsx
          apps/web/src/domains/creator/brush/StudioBrushEngineProgramControls.test.tsx

      - name: Audit every listed name and material response
        run: >-
          pnpm exec tsx scripts/audit-studio-brush-semantic-quality.mts
          --check
          --out-dir=${{ runner.temp }}/studio-brush-semantic-quality

      - name: Audit full-range hardware-pressure curves
        run: >-
          pnpm exec tsx scripts/audit-studio-brush-pressure-curves.mts
          --check
          --out-dir=${{ runner.temp }}/studio-brush-semantic-quality

      - name: Lint semantic quality and engine-composer surfaces
        run: >-
          pnpm exec eslint --max-warnings=0
          scripts/audit-studio-brush-pressure-curves.mts
          scripts/audit-studio-brush-semantic-quality.mts
          apps/web/src/domains/creator/StudioActiveBrushSummary.test.tsx
          apps/web/src/domains/creator/StudioActiveBrushSummary.tsx
          apps/web/src/domains/creator/brush/StudioBrushEngineMixer.test.tsx
          apps/web/src/domains/creator/brush/StudioBrushEngineMixer.tsx
          apps/web/src/domains/creator/brush/StudioBrushEngineProgramControls.test.tsx
          apps/web/src/domains/creator/brush/StudioBrushEngineProgramControls.tsx
          apps/web/src/domains/creator/brush/studio-brush-catalog.ts
          apps/web/src/domains/creator/brush/studio-brush-engine-mix.test.ts
          apps/web/src/domains/creator/brush/studio-brush-engine-mix.ts
          apps/web/src/domains/creator/brush/studio-brush-material-distinctness.test.ts
          apps/web/src/domains/creator/brush/studio-brush-material-distinctness.ts
          apps/web/src/domains/creator/brush/studio-brush-pressure-curve-quality.test.ts
          apps/web/src/domains/creator/brush/studio-brush-pressure-curve-quality.ts
          apps/web/src/domains/creator/brush/studio-brush-semantic-quality.test.ts
          apps/web/src/domains/creator/brush/studio-brush-semantic-quality.ts

      - name: Typecheck
        run: pnpm exec tsc -p tsconfig.json --noEmit --incremental false

      - name: Build production Studio
        run: pnpm run build

      - name: Upload semantic, material and pressure receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: studio-brush-semantic-quality
          path: ${{ runner.temp }}/studio-brush-semantic-quality
          if-no-files-found: warn
          retention-days: 14
