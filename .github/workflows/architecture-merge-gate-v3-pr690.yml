name: Memory-safe final merge gate for architecture PR 690

on:
  push:
    branches:
      - refactor/layered-architecture-20260904
    paths:
      - .github/workflows/architecture-merge-gate-v3-pr690.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: architecture-merge-gate-v3-pr690
  cancel-in-progress: true

jobs:
  core:
    name: core
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PR_NUMBER: "690"
      BRANCH_NAME: refactor/layered-architecture-20260904
      REVIEWED_HEAD: f53139cdbe8c3d56cf15a65190cc64356bc537f4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/layered-architecture-20260904
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Add build swap
        run: |
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Rebuild reviewed architecture work on latest main
        id: rebuild
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "toonstudio-architecture-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main "$BRANCH_NAME"
          MAIN_SHA="$(git rev-parse origin/main)"
          git checkout --detach "$REVIEWED_HEAD"
          git reset --hard "$REVIEWED_HEAD"
          git merge --no-edit --no-ff -X theirs "$MAIN_SHA"

          for path in \
            .github/workflows/architecture-merge-gate-v3-pr690.yml \
            .github/workflows/architecture-final-core-pr690.yml \
            .github/workflows/architecture-authoritative-v2-pr690.yml \
            .github/workflows/architecture-main-sync-pr690.yml \
            .github/workflows/architecture-finalize-pr690.yml \
            .github/workflows/architecture-rebuild-and-merge-pr690.yml \
            .github/workflows/architecture-definitive-merge-pr690.yml \
            .github/workflows/architecture-fast-merge-pr690.yml \
            .github/workflows/architecture-source-snapshot.yml \
            .github/workflows/architecture-snapshot.yml; do
            if [ -f "$path" ]; then git rm "$path"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "chore(architecture): remove one-off synchronization helpers"
          fi

          python3 - "$MAIN_SHA" <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import sys

          main = sys.argv[1]
          host = Path("apps/web/src/domains/creator/StudioCuttoonEditorHost.tsx")
          ratchet = Path("apps/web/src/domains/creator/studio-host-architecture-ratchet.test.ts")
          if not host.exists() or not ratchet.exists():
              raise SystemExit("required Studio architecture files are missing")
          candidate = len(host.read_text(encoding="utf-8").splitlines())
          main_lines = len(
              subprocess.check_output(
                  ["git", "show", f"{main}:apps/web/src/domains/creator/StudioCuttoonEditorHost.tsx"],
                  text=True,
              ).splitlines()
          )
          if candidate > 29_700 and candidate > main_lines - 500:
              raise SystemExit(
                  f"Studio host insufficiently reduced: main={main_lines}, candidate={candidate}"
              )
          source = ratchet.read_text(encoding="utf-8")
          source, changes = re.subn(
              r"const HOST_MAX_LINES = [0-9_]+;",
              f"const HOST_MAX_LINES = {candidate:_};",
              source,
              count=1,
          )
          if changes != 1:
              raise SystemExit("HOST_MAX_LINES ratchet not found")
          ratchet.write_text(source, encoding="utf-8")

          limits = {
              "apps/web/src/app/routes/AppRouter.tsx": 220,
              "apps/web/src/domains/creator/studio-router/StudioRouter.tsx": 200,
              "apps/web/src/domains/creator/studio-host-architecture-ratchet.test.ts": 2200,
              "scripts/validate-architecture.mjs": 2400,
          }
          failures = []
          for name, limit in limits.items():
              path = Path(name)
              if not path.exists():
                  failures.append(f"missing {name}")
                  continue
              lines = len(path.read_text(encoding="utf-8").splitlines())
              if lines > limit:
                  failures.append(f"{name}: {lines} > {limit}")
          if failures:
              raise SystemExit("\n".join(failures))
          print(f"Studio host main={main_lines}, candidate={candidate}")
          PY
          if ! git diff --quiet; then
            git add apps/web/src/domains/creator/studio-host-architecture-ratchet.test.ts
            git commit -m "test(architecture): ratchet synchronized studio host size"
          fi
          echo "main_sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Architecture and lint
        run: |
          pnpm run validate:architecture
          pnpm run lint:quick:fix
          if ! git diff --quiet || ! git diff --cached --quiet; then
            git add -A
            git commit -m "style(architecture): normalize latest-main integration"
          fi
          pnpm run lint:quick

      - name: Full frontend and API typecheck
        run: pnpm run typecheck

      - name: Focused architecture and route regressions
        run: |
          pnpm exec vitest run \
            apps/web/src/domains/creator/studio-host-architecture-ratchet.test.ts \
            apps/web/src/domains/creator/studio-router/StudioRouter.canonical-redirect.test.tsx \
            apps/web/src/domains/creator/studio-router/StudioDocumentRuntimeBoundary.test.tsx \
            apps/web/src/app/routes/app-route-title-ownership.test.ts \
            --passWithNoTests

      - name: Production build and Studio bundle budget
        run: |
          pnpm run build
          pnpm run check:studio-bundle
          git diff --check
          git diff --quiet
          git diff --cached --quiet

      - name: Push exact verified tree
        id: push
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$BRANCH_NAME"
          test "$(git rev-parse origin/main)" = "${{ steps.rebuild.outputs.main_sha }}"
          HEAD_SHA="$(git rev-parse HEAD)"
          REMOTE_SHA="$(git rev-parse "origin/$BRANCH_NAME")"
          git push \
            --force-with-lease="refs/heads/$BRANCH_NAME:$REMOTE_SHA" \
            origin "HEAD:refs/heads/$BRANCH_NAME"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Wait for exact PR head/base
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6 7 8; do
            HEAD_SHA="$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" --jq '.head.sha')"
            BASE_SHA="$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" --jq '.base.sha')"
            MAIN_SHA="$(gh api "repos/${{ github.repository }}/branches/main" --jq '.commit.sha')"
            MERGEABLE="$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" --jq '.mergeable')"
            if [ "$HEAD_SHA" = "${{ steps.push.outputs.head_sha }}" ] \
              && [ "$BASE_SHA" = "${{ steps.rebuild.outputs.main_sha }}" ] \
              && [ "$MAIN_SHA" = "${{ steps.rebuild.outputs.main_sha }}" ] \
              && [ "$MERGEABLE" = "true" ]; then
              exit 0
            fi
            test "$MAIN_SHA" = "${{ steps.rebuild.outputs.main_sha }}"
            sleep $((attempt * 8))
          done
          exit 1

      - name: Publish required core success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            "repos/${{ github.repository }}/statuses/${{ steps.push.outputs.head_sha }}" \
            -f state=success \
            -f context=core \
            -f description="Architecture, lint, types, regressions, build and bundle passed" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Merge exact verified head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/${{ github.repository }}/branches/main" --jq '.commit.sha')" = "${{ steps.rebuild.outputs.main_sha }}"
          gh api \
            --method PUT \
            "repos/${{ github.repository }}/pulls/$PR_NUMBER/merge" \
            -f merge_method=squash \
            -f sha="${{ steps.push.outputs.head_sha }}" \
            -f commit_title="refactor(architecture): layer routes and extract studio runtimes (#690)" \
            -f commit_message="Latest-main candidate passed architecture validation, normalized changed-file lint, full frontend/API typecheck, focused route and Studio regressions, production build, and Studio bundle budget."

      - name: Verify merged main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" --jq '.merged')" = "true"
          MERGE_SHA="$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" --jq '.merge_commit_sha')"
          MAIN_SHA="$(gh api "repos/${{ github.repository }}/branches/main" --jq '.commit.sha')"
          test "$MERGE_SHA" = "$MAIN_SHA"
          echo "main=$MAIN_SHA"
