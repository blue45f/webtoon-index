name: Land Creator Marketplace authoring overhaul

on:
  push:
    branches:
      - feat/marketplace-creator-pipeline-20260903
    paths:
      - ".github/workflows/marketplace-authoring-finalizer.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marketplace-authoring-product-landing
  cancel-in-progress: false

jobs:
  land-product:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CI: "true"
      NODE_OPTIONS: --max-old-space-size=8192
      FEATURE_BRANCH: feat/marketplace-creator-pipeline-20260903
    steps:
      - name: Checkout complete feature history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: feat/marketplace-creator-pipeline-20260903

      - name: Synchronize latest feature and main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "toonstudio-marketplace-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$FEATURE_BRANCH" main
          git reset --hard "origin/$FEATURE_BRANCH"
          git rev-parse HEAD > /tmp/marketplace-remote-feature-head.txt
          git merge --no-edit origin/main

      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Materialize product integrations
        shell: bash
        run: |
          set -euo pipefail
          scripts=(
            normalize-authoring-safety-source.mjs
            normalize-package-builder.mjs
            harden-authoring-payload.mjs
            integrate-quality-validation.mjs
            integrate-creator-authoring.mjs
            integrate-authoring-detail-action.mjs
            integrate-brush-recipe-lab.mjs
            integrate-asset-quality-matrix.mjs
            integrate-source-package-builder.mjs
            integrate-package-recovery.mjs
            prepare-permanent-authoring-workflow.mjs
            harden-authoring-integration-idempotency.mjs
          )
          for script in "${scripts[@]}"; do
            node --check "scripts/marketplace/$script"
            node "scripts/marketplace/$script"
          done
          git diff --check

      - name: Prove product integration is idempotent
        shell: bash
        run: |
          set -euo pipefail
          targets=(
            apps/web/src/domains/market/pages/MarketPublishPage.tsx
            apps/web/src/domains/market/components/MarketResourceDetailArticle.tsx
            apps/web/src/domains/market/components/MarketplaceAuthoringWorkshop.tsx
            apps/web/src/domains/market/components/MarketplaceAuthoringInstallAction.tsx
            apps/web/src/domains/creator/MarketplaceBrushStudioBridge.tsx
            apps/web/src/domains/creator/MarketplaceBrushPublishShortcut.tsx
            apps/web/src/domains/creator/brush/StudioBrushStudio.tsx
            apps/web/src/shared/lib/creator-marketplace-authoring-workshop.ts
            apps/web/src/shared/lib/creator-marketplace-authoring-safety.ts
            apps/web/src/shared/lib/creator-marketplace-package-builder.ts
            .github/workflows/marketplace-authoring.yml
          )
          sha256sum "${targets[@]}" > /tmp/marketplace-first.sha
          scripts=(
            normalize-authoring-safety-source.mjs
            normalize-package-builder.mjs
            harden-authoring-payload.mjs
            integrate-quality-validation.mjs
            integrate-creator-authoring.mjs
            integrate-authoring-detail-action.mjs
            integrate-brush-recipe-lab.mjs
            integrate-asset-quality-matrix.mjs
            integrate-source-package-builder.mjs
            integrate-package-recovery.mjs
            prepare-permanent-authoring-workflow.mjs
            harden-authoring-integration-idempotency.mjs
          )
          for script in "${scripts[@]}"; do node "scripts/marketplace/$script" >/dev/null; done
          sha256sum "${targets[@]}" > /tmp/marketplace-second.sha
          diff -u /tmp/marketplace-first.sha /tmp/marketplace-second.sha
          grep -Fq '<MarketplaceAuthoringWorkshop />' apps/web/src/domains/market/pages/MarketPublishPage.tsx
          grep -Fq '<MarketplaceBrushStudioBridge snapshot={currentSnapshot} visible={open} />' apps/web/src/domains/creator/brush/StudioBrushStudio.tsx
          grep -Fq '<MarketplaceAuthoringInstallAction record={record} />' apps/web/src/domains/market/components/MarketResourceDetailArticle.tsx

      - name: Remove one-time migration machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/marketplace-source-snapshot.yml \
            .github/workflows/marketplace-authoring-contract-fixer.yml \
            .github/workflows/marketplace-authoring-integrator.yml \
            .github/workflows/marketplace-authoring-browser.yml \
            .github/workflows/marketplace-authoring-detail-integrator.yml \
            .github/workflows/marketplace-authoring-release-gate.yml \
            .github/workflows/marketplace-brush-recipe-integrator.yml \
            .github/workflows/marketplace-authoring-idempotency.yml \
            .github/workflows/marketplace-authoring-finalizer-kick.yml \
            .github/workflows/marketplace-authoring-finalizer.yml \
            scripts/marketplace/fix-authoring-contracts.mjs \
            scripts/marketplace/normalize-authoring-safety-source.mjs \
            scripts/marketplace/normalize-package-builder.mjs \
            scripts/marketplace/harden-authoring-payload.mjs \
            scripts/marketplace/integrate-quality-validation.mjs \
            scripts/marketplace/integrate-creator-authoring.mjs \
            scripts/marketplace/integrate-authoring-detail-action.mjs \
            scripts/marketplace/integrate-brush-recipe-lab.mjs \
            scripts/marketplace/integrate-asset-quality-matrix.mjs \
            scripts/marketplace/integrate-source-package-builder.mjs \
            scripts/marketplace/integrate-package-recovery.mjs \
            scripts/marketplace/prepare-permanent-authoring-workflow.mjs \
            scripts/marketplace/harden-authoring-integration-idempotency.mjs \
            marketplace-benchmark/.route-marker \
            marketplace-benchmark/.upload-probe.txt \
            marketplace-benchmark/.upload-route-readme.md \
            marketplace-authoring-integration-report.json \
            marketplace-authoring-detail-integration-report.json \
            marketplace-brush-recipe-integration-report.json \
            marketplace-authoring-idempotency-report.json \
            marketplace-authoring-payload-safety-report.json \
            marketplace-package-builder-normalization-report.json \
            marketplace-asset-quality-integration-report.json \
            marketplace-source-package-integration-report.json \
            marketplace-package-recovery-integration-report.json \
            marketplace-quality-validation-integration-report.json \
            marketplace-permanent-workflow-report.json \
            marketplace-authoring-release-gate.json
          git diff --check

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Normalize product import ordering
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec eslint --fix \
            apps/web/src/domains/market/pages/MarketPublishPage.tsx \
            apps/web/src/domains/market/components/MarketResourceDetailArticle.tsx \
            apps/web/src/domains/market/components/MarketplaceAuthoringWorkshop.tsx \
            apps/web/src/domains/market/components/MarketplaceAuthoringInstallAction.tsx \
            apps/web/src/domains/market/components/MarketplaceAssetQualityMatrix.test.tsx \
            apps/web/src/domains/market/components/MarketplaceAuthoringWorkshop.test.tsx \
            apps/web/src/domains/market/components/MarketplaceBrushRecipeAccelerator.test.tsx \
            apps/web/src/domains/creator/MarketplaceBrushStudioBridge.tsx \
            apps/web/src/domains/creator/MarketplaceBrushStudioBridge.test.tsx \
            apps/web/src/domains/creator/brush/StudioBrushStudio.tsx

      - name: Run authoring and package contracts
        run: >-
          pnpm exec vitest run
          apps/web/src/shared/lib/creator-marketplace-authoring-safety.test.ts
          apps/web/src/shared/lib/creator-marketplace-authoring-workshop.test.ts
          apps/web/src/shared/lib/creator-marketplace-package-builder.test.ts
          apps/web/src/shared/lib/creator-marketplace-quality-validation.test.ts
          apps/web/src/domains/creator/MarketplaceBrushStudioBridge.test.tsx
          apps/web/src/domains/market/components/MarketplaceAuthoringWorkshop.test.tsx
          apps/web/src/domains/market/components/MarketplaceBrushRecipeAccelerator.test.tsx
          apps/web/src/domains/market/components/MarketplaceAssetQualityMatrix.test.tsx
          --reporter=verbose

      - name: Run existing marketplace regressions
        run: pnpm exec vitest run apps/web/src/domains/market --reporter=verbose

      - name: Type-check, lint, architecture, and build
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec tsc -p tsconfig.json --noEmit
          pnpm run lint
          pnpm run validate:architecture
          pnpm run build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run desktop, mobile, and in-app marketplace flows
        run: >-
          xvfb-run -a --server-args="-screen 0 1920x1200x24"
          pnpm exec playwright test
          e2e/market.spec.ts
          e2e/marketplace-authoring-workshop.spec.ts
          e2e/marketplace-authoring-inapp.spec.ts
          --project=chromium
          --reporter=line,html

      - name: Prepare certified product commit
        shell: bash
        run: |
          set -euo pipefail
          git restore --worktree -- apps/web/public/data 2>/dev/null || true
          rm -rf playwright-report test-results coverage dist
          mkdir -p marketplace-benchmark
          cat > marketplace-benchmark/creator-authoring-verification.json <<JSON
          {
            "status": "passed",
            "featureBranch": "${FEATURE_BRANCH}",
            "verifiedHead": "$(git rev-parse HEAD)",
            "workflowRunId": "${GITHUB_RUN_ID}",
            "workflowRunAttempt": "${GITHUB_RUN_ATTEMPT}",
            "unitContracts": "passed",
            "marketRegressions": "passed",
            "typescript": "passed",
            "lint": "passed",
            "architecture": "passed",
            "productionBuild": "passed",
            "browserEngine": "Chromium",
            "browserProfiles": ["desktop", "mobile", "kakaotalk", "naver", "instagram"],
            "physicalDeviceVerified": false,
            "generatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          git add -A
          git diff --cached --check
          git status --short

      - name: Commit and push verified product
        shell: bash
        run: |
          set -euo pipefail
          remote_before="$(git ls-remote origin "refs/heads/${FEATURE_BRANCH}" | awk '{print $1}')"
          expected_remote="$(cat /tmp/marketplace-remote-feature-head.txt)"
          if [[ "$remote_before" != "$expected_remote" ]]; then
            echo "Feature branch advanced during verification: expected ${expected_remote}, found ${remote_before}" >&2
            exit 1
          fi
          git commit -m "feat(market): land verified creator authoring product integration"
          git push origin HEAD:"$FEATURE_BRANCH"
