name: Studio 2D asset quality
on:
  push:
    branches: [main, 'feat/studio-2d-assets-*']
    paths:
      - 'apps/web/src/domains/creator/studio-bg*'
      - 'apps/web/src/domains/creator/studio-2d*'
      - 'apps/web/src/domains/creator/Studio2d*'
      - 'apps/web/src/domains/creator/StudioSceneToolPopoverBody.tsx'
      - 'apps/web/src/domains/creator/studio-page-lazy-ui.ts'
      - 'apps/web/src/domains/creator/studio-tool-belt-lazy-ui-boundary.test.ts'
      - 'apps/web/src/domains/creator/StudioToolBeltContent.tsx'
      - 'apps/web/src/domains/creator/StudioCuttoonEditorHost.tsx'
      - 'scripts/studio-2d*'
      - 'apps/web/public/assets/studio/backgrounds/**'
      - '.github/workflows/studio-2d-asset-quality.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/src/domains/creator/studio-bg*'
      - 'apps/web/src/domains/creator/studio-2d*'
      - 'apps/web/src/domains/creator/Studio2d*'
      - 'apps/web/src/domains/creator/StudioSceneToolPopoverBody.tsx'
      - 'apps/web/src/domains/creator/studio-page-lazy-ui.ts'
      - 'apps/web/src/domains/creator/studio-tool-belt-lazy-ui-boundary.test.ts'
      - 'apps/web/src/domains/creator/StudioToolBeltContent.tsx'
      - 'apps/web/src/domains/creator/StudioCuttoonEditorHost.tsx'
      - 'scripts/studio-2d*'
      - 'apps/web/public/assets/studio/backgrounds/**'
      - '.github/workflows/studio-2d-asset-quality.yml'
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: studio-2d-asset-quality-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  asset-quality:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit native files, compatibility aliases and review metadata
        run: |
          mkdir -p artifacts/studio-2d
          node scripts/studio-2d-asset-audit.mjs | tee artifacts/studio-2d/asset-audit.json
          node --test scripts/studio-2d-asset-quality.test.mjs | tee artifacts/studio-2d/file-tests.txt
      - name: Test filtering, accessible insertion and original aspect ratio
        run: pnpm exec vitest run apps/web/src/domains/creator/studio-2d-lazy-boundary.test.ts apps/web/src/domains/creator/studio-tool-belt-lazy-ui-boundary.test.ts apps/web/src/domains/creator/studio-2d-asset-quality.test.ts apps/web/src/domains/creator/studio-2d-source-size.test.ts apps/web/src/domains/creator/studio-2d-review-content.test.ts apps/web/src/domains/creator/studio-2d-content-discovery.test.ts apps/web/src/domains/creator/Studio2dContentFilters.test.tsx apps/web/src/domains/creator/Studio2dSceneBrowser.test.tsx apps/web/src/domains/creator/Studio2dSceneResilience.test.tsx scripts/studio-2d-image-readiness.test.mjs scripts/studio-2d-asset-quality.test.mjs apps/web/src/domains/creator/studio-assets.test.ts apps/web/src/domains/creator/studio-host-architecture-ratchet.test.ts | tee artifacts/studio-2d/component-tests.txt
      - name: Lint changed modules
        run: pnpm exec eslint apps/web/src/domains/creator/studio-2d-*.ts apps/web/src/domains/creator/Studio2d*.tsx apps/web/src/domains/creator/studio-bg-scenes.ts apps/web/src/domains/creator/StudioSceneToolPopoverBody.tsx apps/web/src/domains/creator/studio-page-lazy-ui.ts scripts/studio-2d-*.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - name: Validate actual component with original images in Chromium
        run: node scripts/studio-2d-browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-2d-asset-evidence
          path: artifacts/studio-2d/
          retention-days: 7
          if-no-files-found: error
