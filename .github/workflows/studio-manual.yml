name: Studio manual

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/src/domains/creator/manual/**'
      - 'apps/web/src/domains/creator/studio-help-menu-items*'
      - 'apps/web/src/domains/creator/studio-command-catalog*'
      - 'apps/web/src/domains/creator/studio-main-menu-group-spec-help.ts'
      - 'apps/web/src/app/routes/groups/creator.routes.tsx'
      - 'apps/web/src/app/routes/groups/studio-manual.routes.test.tsx'
      - 'apps/web/src/app/routes/app-route-title-ownership.ts'
      - 'scripts/verify-studio-manual.mjs'
      - '.github/workflows/studio-manual.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: studio-manual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  manual-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      VITE_CATALOG_SOURCE: static
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Manual, route and existing menu/catalog regression tests
        run: >-
          pnpm exec vitest run
          apps/web/src/domains/creator/manual/studio-manual.test.ts
          apps/web/src/app/routes/groups/studio-manual.routes.test.tsx
          apps/web/src/domains/creator/studio-help-menu-items.test.ts
          apps/web/src/domains/creator/studio-command-catalog.test.ts
          apps/web/src/domains/creator/studio-main-menu-groups.test.ts
          apps/web/src/domains/creator/studio-main-menu-group-spec.test.ts
      - name: Lint changed manual surface
        run: >-
          pnpm exec eslint apps/web/src/domains/creator/manual
          apps/web/src/app/routes/groups/creator.routes.tsx apps/web/src/app/routes/groups/studio-manual.routes.test.tsx
          apps/web/src/app/routes/app-route-title-ownership.ts apps/web/src/domains/creator/studio-help-menu-items.ts
          apps/web/src/domains/creator/studio-help-menu-items.test.ts apps/web/src/domains/creator/studio-command-catalog.ts
          apps/web/src/domains/creator/studio-command-catalog-base.ts
          apps/web/src/domains/creator/studio-main-menu-group-spec-help.ts scripts/verify-studio-manual.mjs
      - run: pnpm run build:bundle
      - run: pnpm exec playwright install --with-deps chromium
      - name: Desktop, mobile, search, direct links, clipboard and print
        run: node scripts/verify-studio-manual.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: studio-manual-browser
          path: artifacts/studio-manual
          if-no-files-found: ignore
