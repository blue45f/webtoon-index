name: Creator homepage quality
on:
  push:
    branches: [feat/creator-home-navigation-20260906]
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/src/domains/marketing/**'
      - 'apps/web/src/shared/components/site-header*'
      - 'apps/web/src/shared/components/site-footer.tsx'
      - 'apps/web/src/app/AppShell.tsx'
      - 'apps/web/src/app/routes/**'
      - 'apps/web/public/brand/**'
      - 'apps/web/public/i18n/app/**'
      - 'media/brand-film/**'
      - 'automation/n8n/**'
      - 'scripts/verify-creator-home.mjs'
      - 'scripts/verify-creator-film-upgrades.mjs'
      - 'scripts/verify-creator-home-navigation.mjs'
      - 'scripts/creator-film-automation.test.mjs'
      - '.github/workflows/creator-home-quality.yml'
permissions:
  contents: read
concurrency:
  group: creator-home-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  creator-home:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec eslint apps/web/src/domains/marketing apps/web/src/shared/components/site-header.tsx apps/web/src/shared/components/site-header-mobile-nav.tsx apps/web/src/shared/components/site-footer.tsx scripts/verify-creator-home.mjs scripts/verify-creator-film-upgrades.mjs scripts/verify-creator-home-navigation.mjs scripts/creator-film-automation.test.mjs media/brand-film/src media/brand-film/render.mjs --max-warnings=0
          pnpm run typecheck
          pnpm exec vitest run apps/web/src/domains/marketing scripts/creator-film-automation.test.mjs
          node --test scripts/creator-film-automation.test.mjs
          pnpm run build:bundle
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pnpm exec playwright install --with-deps chromium
      - name: Verify production homepage, films and native section navigation
        run: |
          pnpm exec vite preview --host 127.0.0.1 --port 4173 > /tmp/creator-home-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          node scripts/verify-creator-home.mjs
          node scripts/verify-creator-film-upgrades.mjs
          node scripts/verify-creator-home-navigation.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: creator-home-${{ github.sha }}
          path: artifacts/creator-home/
          if-no-files-found: ignore
