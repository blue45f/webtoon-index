name: WebGPU tile provider V2 atlas

on:
  push:
    branches:
      - feat/webgpu-tile-provider-v2-atlas-clean-20260904
    paths:
      - "apps/web/src/domains/creator/render/studio-engine-webgpu-tile-provider-v2-atlas.ts"
      - "apps/web/src/domains/creator/render/studio-engine-webgpu-tile-provider-v2-atlas.test.ts"
      - ".github/workflows/webgpu-tile-provider-v2-atlas.yml"
  pull_request:
    paths:
      - "apps/web/src/domains/creator/render/studio-engine-webgpu-tile-provider-v2-atlas.ts"
      - "apps/web/src/domains/creator/render/studio-engine-webgpu-tile-provider-v2-atlas.test.ts"
      - ".github/workflows/webgpu-tile-provider-v2-atlas.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webgpu-tile-provider-v2-atlas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  atlas-v2:
    name: atlas-v2
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Focused unit tests
        run: >-
          pnpm exec vitest run
          apps/web/src/domains/creator/render/studio-engine-webgpu-tile-provider-v1.test.ts
          apps/web/src/domains/creator/render/studio-engine-webgpu-tile-provider-v2-atlas.test.ts

      - name: Focused lint
        run: >-
          pnpm exec eslint --max-warnings=0
          apps/web/src/domains/creator/render/studio-engine-webgpu-tile-provider-v2-atlas.ts
          apps/web/src/domains/creator/render/studio-engine-webgpu-tile-provider-v2-atlas.test.ts

      - name: Typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm exec tsc -p tsconfig.json --noEmit
