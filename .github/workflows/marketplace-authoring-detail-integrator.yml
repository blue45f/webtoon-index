name: Marketplace reverse authoring integrator

on:
  push:
    branches:
      - feat/marketplace-creator-pipeline-20260903
    paths:
      - ".github/workflows/marketplace-authoring-detail-integrator.yml"
      - "scripts/marketplace/integrate-authoring-detail-action.mjs"
      - "apps/web/src/domains/market/components/MarketplaceAuthoringInstallAction.tsx"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marketplace-authoring-detail-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: "true"
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: node scripts/marketplace/integrate-authoring-detail-action.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -p tsconfig.json --noEmit
      - run: pnpm run lint:quick
      - run: pnpm run build
      - name: Commit verified reverse authoring route
        run: |
          if git diff --quiet -- apps/web/src/domains/market/components/MarketResourceDetailArticle.tsx marketplace-authoring-detail-integration-report.json; then
            echo "Reverse authoring route is already integrated."
            exit 0
          fi
          git config user.name "toonstudio-marketplace-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            apps/web/src/domains/market/components/MarketResourceDetailArticle.tsx \
            marketplace-authoring-detail-integration-report.json
          git commit -m "feat(market): connect listings back to Studio authoring"
          git push origin HEAD:feat/marketplace-creator-pipeline-20260903
