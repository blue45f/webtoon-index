name: Marketplace brush recipe integrator

on:
  push:
    branches:
      - feat/marketplace-creator-pipeline-20260903
    paths:
      - ".github/workflows/marketplace-brush-recipe-integrator.yml"
      - "scripts/marketplace/integrate-brush-recipe-lab.mjs"
      - "apps/web/src/domains/market/components/MarketplaceBrushRecipeAccelerator.tsx"
      - "apps/web/src/domains/market/components/MarketplaceBrushRecipeAccelerator.test.tsx"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marketplace-brush-recipe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: "true"
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: node scripts/marketplace/integrate-brush-recipe-lab.mjs
      - run: pnpm install --frozen-lockfile
      - name: Recipe and authoring tests
        run: >-
          pnpm exec vitest run
          apps/web/src/shared/lib/creator-marketplace-authoring-workshop.test.ts
          apps/web/src/domains/market/components/MarketplaceAuthoringWorkshop.test.tsx
          apps/web/src/domains/market/components/MarketplaceBrushRecipeAccelerator.test.tsx
          --reporter=verbose
      - run: pnpm exec tsc -p tsconfig.json --noEmit
      - run: pnpm run lint:quick
      - run: pnpm run build
      - name: Commit verified recipe lab integration
        run: |
          git config user.name "toonstudio-marketplace-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            apps/web/src/domains/market/components/MarketplaceAuthoringWorkshop.tsx \
            marketplace-brush-recipe-integration-report.json
          if git diff --cached --quiet; then
            echo "Recipe lab already integrated."
          else
            git commit -m "feat(market): add advanced brush recipe lab to publishing"
            git push origin HEAD:feat/marketplace-creator-pipeline-20260903
          fi
