name: Webtoon assistant regression

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/web/src/domains/creator/assistant/**"
      - "apps/web/src/domains/creator/StudioCompanionAssistantDisplay*"
      - "apps/web/src/domains/creator/StudioReferencePanel*"
      - "apps/web/src/domains/creator/studio-reference-import*"
      - "apps/web/src/domains/creator/studio-workbench-*"
      - "apps/web/src/domains/creator/use-studio-copy-feedback*"
      - "apps/web/src/domains/creator/studio-panel-ui*"
      - "apps/web/src/domains/creator/studio-sfx-lettering*"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/webtoon-assistant-regression.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/src/domains/creator/assistant/**"
      - "apps/web/src/domains/creator/StudioCompanionAssistantDisplay*"
      - "apps/web/src/domains/creator/StudioReferencePanel*"
      - "apps/web/src/domains/creator/studio-reference-import*"
      - ".github/workflows/webtoon-assistant-regression.yml"

permissions:
  contents: read

concurrency:
  group: webtoon-assistant-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  webtoon-assistant-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        shell: bash
        run: |
          set +e
          pnpm install --frozen-lockfile > "$RUNNER_TEMP/webtoon-install.log" 2>&1
          result=$?
          tail -n 30 "$RUNNER_TEMP/webtoon-install.log"
          exit "$result"
      - name: Diagnose native clipboard file support
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { JSDOM } from 'jsdom';
          const dom = new JSDOM('');
          try {
            const file = new dom.window.File(['GIF89a'], 'clipboard.gif', { type: 'image/gif' });
            console.log(JSON.stringify({ node: process.version, fileBytes: file.size, arrayBuffer: typeof file.arrayBuffer }));
            if (typeof file.arrayBuffer === 'function') {
              console.log(`GIF signature: ${new TextDecoder().decode(await file.arrayBuffer())}`);
            }
          } finally {
            dom.window.close();
          }
          JS
      # This fast feedback job supplements, never replaces, the complete required core suite.
      - name: Verify assistant surfaces, reference imports and shared engines
        shell: bash
        run: |
          set +e
          pnpm exec vitest run \
            apps/web/src/domains/creator/assistant \
            apps/web/src/domains/creator/StudioCompanionAssistantDisplay.test.tsx \
            apps/web/src/domains/creator/StudioReferencePanel.test.tsx \
            apps/web/src/domains/creator/studio-reference-import \
            apps/web/src/domains/creator/studio-workbench-tabs.test.tsx \
            apps/web/src/domains/creator/studio-sfx-lettering.test.ts \
            --reporter=json \
            --outputFile="$RUNNER_TEMP/webtoon-assistant-results.json" \
            > "$RUNNER_TEMP/webtoon-assistant-tests.log" 2>&1
          result=$?
          export WEBTOON_TEST_EXIT_CODE="$result"
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const path = `${process.env.RUNNER_TEMP}/webtoon-assistant-results.json`;
          try {
            const report = JSON.parse(readFileSync(path, 'utf8'));
            const summary = [
              `Webtoon assistant regression: exit ${process.env.WEBTOON_TEST_EXIT_CODE}`,
              `Tests: ${report.numPassedTests} passed, ${report.numFailedTests} failed, ${report.numPendingTests} pending, ${report.numTotalTests} total`,
            ];
            for (const file of report.testResults ?? []) {
              const name = file.name.replace(`${process.env.GITHUB_WORKSPACE}/`, '');
              summary.push(`${file.status}: ${name}`);
              for (const test of file.assertionResults ?? []) {
                if (test.status !== 'failed') continue;
                summary.push(`FAIL: ${test.fullName}`);
                for (const message of test.failureMessages ?? []) {
                  summary.push(message.slice(0, 1800));
                }
              }
              if (file.status === 'failed' && file.message) summary.push(file.message.slice(0, 1800));
            }
            const text = summary.join('\n').slice(0, 40000);
            console.log(text);
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\n\`\`\`text\n${text}\n\`\`\`\n`);
          } catch (error) {
            console.error(`Unable to read test report: ${error.message}`);
            process.exitCode = 1;
          }
          JS
          report_result=$?
          if [ "$result" -ne 0 ] || [ "$report_result" -ne 0 ]; then
            tail -n 60 "$RUNNER_TEMP/webtoon-assistant-tests.log"
            if [ "$result" -ne 0 ]; then exit "$result"; fi
            exit "$report_result"
          fi
