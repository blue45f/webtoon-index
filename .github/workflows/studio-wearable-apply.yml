name: Recover verified wearable source and content-addressed requests
on:
  # Source recovery and writes are explicit operator actions, never PR or branch-push work.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wearable-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integrate:
    if: github.ref == 'refs/heads/fix/studio-wearable-quality-audit-20260906'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Recover the exact source that passed 358 rendered frames
        uses: actions/download-artifact@v4
        with:
          name: wearable-final-integration-b0f611af2f5eea9299badfa90222800d6600d26a
          run-id: 34007956381
          github-token: ${{ github.token }}
          path: .wearable-recovery
      - name: Verify and apply the bounded source and cache patches
        run: |
          mkdir -p wearable-release-evidence
          echo 'fcc9656fc49fcb14b5be0e1d024fb0a343c7214d373c4da4304aa83ac4037935  .wearable-recovery/source.patch' | sha256sum -c -
          echo '661fa849fc8c2c3407877c0cd581fec2fab4e112bed462019266c320c9b6217f  scripts/studio-wearable-cache-release.patch' | sha256sum -c -
          git apply --check .wearable-recovery/source.patch
          git apply .wearable-recovery/source.patch
          git apply --check scripts/studio-wearable-cache-release.patch
          git apply scripts/studio-wearable-cache-release.patch
          git rev-parse HEAD > wearable-release-evidence/input-commit.txt
      - name: Regenerate geometry and its matching request-revision module
        run: pnpm exec tsx scripts/generate-studio-wearable-v5.mts > wearable-release-evidence/generation.json
      - name: Check the same positive and negative frame controls
        run: node --test scripts/studio-wearable-frame-evidence.node-check.mjs
      - name: Lint reviewed production changes and regressions
        run: |
          set -o pipefail
          pnpm exec eslint --fix --max-warnings=0 apps/web/src/domains/creator/vrm/studio-vrm-head-surface.ts apps/web/src/domains/creator/vrm/studio-vrm-head-surface.test.ts apps/web/src/domains/creator/vrm/studio-vrm-prop-rig.ts apps/web/src/domains/creator/vrm/studio-vrm-props.ts apps/web/src/domains/creator/vrm/studio-vrm-prop-quality-policy.ts apps/web/src/domains/creator/vrm/StudioVrmPropPanel.tsx apps/web/src/domains/creator/vrm/StudioVrmPropPanel.quality.test.tsx apps/web/src/domains/creator/vrm/useStudioVrmPoserRuntimeE.ts apps/web/src/domains/creator/vrm/studio-vrm-prop-asset-runtime.ts apps/web/src/domains/creator/vrm/studio-vrm-prop-asset-revisions.ts apps/web/src/domains/creator/vrm/studio-vrm-prop-asset-revisions.test.ts 2>&1 | tee wearable-release-evidence/lint.log
      - name: Complete VRM regressions, real fixtures, legacy props and cache request contracts
        run: |
          set -o pipefail
          pnpm exec vitest run apps/web/src/domains/creator/vrm apps/web/src/domains/creator/studio-everyday-props-pack-v4.test.ts --reporter=default 2>&1 | tee wearable-release-evidence/tests.log
      - name: Stage only reviewed paths and prove every binary against its manifest
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          import validator from 'gltf-validator';
          const manifestPath='apps/web/public/assets/3d/wearable-v5-manifest.json';
          const assets=JSON.parse(fs.readFileSync(manifestPath,'utf8')).assets;
          if(assets.length!==12||assets.some(a=>!/^[-a-z0-9_]+\.glb$/.test(a.file)))throw new Error('Unexpected generated assets');
          const paths=[manifestPath,...assets.map(a=>'apps/web/public/assets/3d/'+a.file),
            'scripts/generate-studio-wearable-v5.mts','scripts/verify-studio-wearable-v5.mts','scripts/studio-wearable-fit.patch',
            ...['studio-vrm-head-surface.ts','studio-vrm-head-surface.test.ts','studio-vrm-prop-rig.ts','studio-vrm-props.ts','studio-vrm-prop-quality-policy.ts','StudioVrmPropPanel.tsx','StudioVrmPropPanel.quality.test.tsx','useStudioVrmPoserRuntimeE.ts','studio-vrm-prop-asset-runtime.ts','studio-vrm-prop-asset-revisions.ts','studio-vrm-prop-asset-revisions.test.ts'].map(p=>'apps/web/src/domains/creator/vrm/'+p)];
          execFileSync('git',['add','-A','--',...paths],{stdio:'inherit'});
          const reports=[];
          for(const a of assets){
            const bytes=execFileSync('git',['show',':apps/web/public/assets/3d/'+a.file],{maxBuffer:16*1024*1024});
            if(createHash('sha256').update(bytes).digest('hex')!==a.sha256)throw new Error('Staged GLB mismatch: '+a.id);
            const result=await validator.validateBytes(new Uint8Array(bytes),{uri:a.file,maxIssues:30});
            reports.push({id:a.id,issues:result.issues});
          }
          fs.writeFileSync('wearable-release-evidence/glb-validation.json',JSON.stringify(reports,null,2));
          if(reports.some(r=>r.issues.numErrors))throw new Error('Invalid GLB format');
          console.log('All 12 staged GLBs match the manifest and pass format validation');
          EOF
          git rm -- scripts/studio-wearable-cache-release.patch
          git diff --cached --binary > wearable-release-evidence/source.patch
          git -c user.name='ToonStudio quality integration' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(studio): integrate verified wearables and content-addressed GLB loading'
      - name: Preserve the verified source before the normal pre-push checks
        if: always()
        run: |
          mkdir -p wearable-release-evidence
          git rev-parse HEAD > wearable-release-evidence/commit.txt
          tar -czf wearable-release-evidence/source.tar.gz apps/web/src/domains/creator/vrm apps/web/public/assets/3d scripts/generate-studio-wearable-v5.mts scripts/verify-studio-wearable-v5.mts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wearable-release-source-${{ github.sha }}
          path: wearable-release-evidence/
          retention-days: 7
      - name: Publish only to the authorized review branch with normal pre-push gates
        run: |
          test "$GITHUB_REF_NAME" = 'fix/studio-wearable-quality-audit-20260906'
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin "HEAD:$GITHUB_REF_NAME"
