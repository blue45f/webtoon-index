name: Reference-rebuilt scene pack
on:
  pull_request:
    paths:
      - 'apps/web/public/assets/reference-rebuild/**'
      - 'scripts/*reference-rebuild*'
      - 'apps/web/src/domains/creator/bg3d/StudioReferenceRebuildPresets.tsx'
      - 'apps/web/src/domains/creator/bg3d/StudioBg3dAssetLibraryPanel*.tsx'
      - '.github/workflows/reference-rebuild.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/public/assets/reference-rebuild/**'
      - 'scripts/*reference-rebuild*'
      - '.github/workflows/reference-rebuild.yml'
permissions:
  contents: read
concurrency:
  group: reference-rebuild-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  generated-glb:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: |
            apps/web/public/assets/reference-rebuild
            scripts/export-reference-rebuild.mjs
            scripts/verify-reference-rebuild.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node --test scripts/verify-reference-rebuild.mjs
      - run: node scripts/export-reference-rebuild.mjs reference-rebuild-output
      - uses: actions/upload-artifact@v4
        with:
          name: reference-rebuilt-glb-six-files
          path: reference-rebuild-output
          if-no-files-found: error
          retention-days: 7
