name: Learning quality

on:
  pull_request:
    branches: [main]
    paths: ['apps/web/src/domains/learn/**', 'e2e/learn*.spec.ts', 'tsconfig.learning.json', '.github/workflows/learning-quality.yml', 'apps/web/src/domains/creator/studio-impasto-relief-shading-v1*.ts']
  push:
    branches: [main]
    paths: ['apps/web/src/domains/learn/**', 'e2e/learn*.spec.ts', 'tsconfig.learning.json', '.github/workflows/learning-quality.yml', 'apps/web/src/domains/creator/studio-impasto-relief-shading-v1*.ts']

permissions:
  contents: read

# main 푸시도 최신 커밋만 남긴다. 그룹을 SHA 로 묶으면 main 실행이 저마다 다른 그룹이 되어
# cancel-in-progress 가 취소할 대상을 갖지 못한다 (ref 로 묶어야 같은 그룹이 된다). 이 게이트는
# 브랜치 보호의 필수 체크가 아니므로 최신 main 상태만 검증하면 되고, 커밋별 신호가 필요한
# ci.yml 은 그대로 SHA 로 묶어 둔다.
concurrency:
  group: learning-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  learning-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      VITE_CATALOG_SOURCE: static
      PLAYWRIGHT_CHANNEL: ''
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -p tsconfig.learning.json
      - run: pnpm exec eslint apps/web/src/domains/learn e2e/learn.spec.ts e2e/learn-resilience.spec.ts apps/web/src/domains/creator/studio-impasto-relief-shading-v1.ts apps/web/src/domains/creator/studio-impasto-relief-shading-v1.light-constants.test.ts --max-warnings=0
      # Directory discovery includes the accessibility suite instead of silently omitting it.
      - name: Learning and shading output regressions
        run: pnpm exec vitest run apps/web/src/domains/learn apps/web/src/domains/creator/studio-impasto-relief-shading-v1.light-constants.test.ts
      # Re-run the actual previously failing budget, without changing its threshold or fixtures.
      # This is additional evidence; the required core/verify gates remain unchanged.
      - name: Existing full performance budgets
        run: pnpm run test:perf
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test e2e/learn.spec.ts e2e/learn-resilience.spec.ts
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: learning-browser-evidence
          path: test-results/
          if-no-files-found: ignore
